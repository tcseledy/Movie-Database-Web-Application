<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search History</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Movie Dashboard</a>

        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="dashboard.html">Search</a>
            <a class="nav-link active" href="history.html">History</a>
            <a class="nav-link" href="theo.html">Theo Cseledy</a>
            <a class="nav-link" href="griffin.html">Griffin Sleyko</a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5">

    <h1 class="mb-4">Search History</h1>

    <p id="historyStatus" class="text-muted"></p>

    <!-- HISTORY LIST -->
    <div id="historyList" class="list-group mb-4">
        <!-- History rows loaded here -->
    </div>

    <!-- HISTORY PAGE BUTTONS -->
    <div id="historyPageControls" class="d-none text-center mb-5">
        <button id="previousHistoryPageBtn" class="btn btn-primary me-2">
            Previous History Page
        </button>

        <span id="historyPageNumber" class="fw-bold mx-3">
            Page 1 of 1
        </span>

        <button id="nextHistoryPageBtn" class="btn btn-primary ms-2">
            Next History Page
        </button>
    </div>

    <!-- SAVED SEARCH RESULTS -->
    <div id="historyResultsSection" class="d-none">
        <h2 id="historyResultsTitle" class="h3 mb-3">
            Saved Search Results
        </h2>

        <p id="savedResultsStatus" class="text-muted"></p>

        <div id="historyMovieResults" class="row g-4">
            <!-- Saved movie results loaded here -->
        </div>

        <!-- SAVED RESULT PAGE BUTTONS -->
        <div id="savedResultPageControls" class="d-none text-center mt-4 mb-5">
            <button id="previousSavedResultPageBtn" class="btn btn-primary me-2">
                Previous Results Page
            </button>

            <span id="savedResultPageNumber" class="fw-bold mx-3">
                Results Page 1 of 1
            </span>

            <button id="nextSavedResultPageBtn" class="btn btn-primary ms-2">
                Next Results Page
            </button>
        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>© 2026 Movie Dashboard</p>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Your JS -->
<script src="js/history.js?v=30"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Movie Dashboard</a>

        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="dashboard.html">Search</a>
            <a class="nav-link active" href="history.html">History</a>
            <a class="nav-link" href="theo.html">Theo Cseledy</a>
            <a class="nav-link" href="griffin.html">Griffin Sleyko</a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5">

    <h1 class="mb-4 text-center">Search Movies</h1>

    <!-- SEARCH BOX -->
    <div class="card p-4 mb-4 shadow">
        <label class="form-label">Enter movie title:</label>

        <div class="input-group">
            <input type="text" id="movieInput" class="form-control" placeholder="Ex: Batman">
            <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>

        <p id="statusMessage" class="mt-3 text-muted"></p>
    </div>

    <!-- RESULTS SECTION -->
    <div id="resultsSection" class="d-none">
        <h2 class="h3 mb-3">Results</h2>

        <div id="movieResults" class="row g-4">
            <!-- Search results loaded here -->
        </div>

        <!-- PAGE BUTTONS -->
        <div id="pageControls" class="d-none text-center mt-4 mb-5">
            <button id="previousPageBtn" class="btn btn-primary me-2">
                Previous
            </button>

            <span id="pageNumber" class="fw-bold mx-3">
                Page 1 of 1
            </span>

            <button id="nextPageBtn" class="btn btn-primary ms-2">
                Next
            </button>
        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>© 2026 Movie Dashboard</p>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Your JS -->
<script src="js/dashboard.js?v=25"></script>

</body>
</html>

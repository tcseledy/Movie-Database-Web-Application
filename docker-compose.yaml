services:
  php:
    container_name: www
    build: ./
    environment:
    - TMDB_TOKEN=${TMDB_TOKEN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./html:/var/www/html/
      - ./password:/var/www/password/
      - ./mycert.crt:/etc/ssl/certs/mycert.crt
      - ./mycert.key:/etc/ssl/private/mycert.key


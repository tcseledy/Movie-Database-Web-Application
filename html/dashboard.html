<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Movie Dashboard</a>

        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="dashboard.html">Search</a>
            <a class="nav-link" href="history.html">History</a>
            <a class="nav-link" href="theo.html">Theo Cseledy</a>
            <a class="nav-link" href="griffin.html">Griffin Sleyko</a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5">

    <h1 class="mb-4 text-center">Search Movies</h1>

    <!-- SEARCH BOX -->
    <div class="card p-4 mb-4 shadow">
        <label class="form-label">Enter movie title:</label>

        <div class="input-group">
            <input type="text" id="movieInput" class="form-control" placeholder="Ex: Batman">
            <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>

        <p id="statusMessage" class="mt-3 text-muted"></p>
    </div>

    <!-- RESULTS SECTION -->
    <div id="resultsSection" class="card p-4 shadow d-none">

        <div class="row">
            <!-- POSTER -->
            <div class="col-md-4 text-center">
                <img id="moviePoster" src="" class="img-fluid rounded" alt="Poster">
            </div>

            <!-- DETAILS -->
            <div class="col-md-8">
                <h2 id="movieTitle"></h2>

                <p><strong>Release Date:</strong> <span id="movieRelease"></span></p>
                <p><strong>Rating:</strong> <span id="movieRating"></span></p>

                <p id="movieOverview"></p>
            </div>
        </div>

    </div>

</div>


<!-- jQuery (REQUIRED for your class) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Your JS -->
<script src="js/dashboard.js?v=21?v=2"></script>

<footer>
    <p>© 2026 Movie Dashboard</p>
</footer>

</body>
</html>

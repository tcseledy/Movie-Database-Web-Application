<div class="container mt-5">
  <h1 class="mb-4 text-center">Search History</h1>

    <!-- HISTORY LIST -->
    <div id="historyList" class="list-group mb-4">
        <!-- Loaded by JS -->
    </div>

    <!-- RESULT DISPLAY -->
    <div id="historyResult" class="card p-4 d-none">
        <div class="row">

            <div class="col-md-5">
                <img id="historyPoster" class="img-fluid rounded">
            </div>

            <div class="col-md-7">
                <h2 id="historyTitle"></h2>
                <p><strong>Release Date:</strong> <span id="historyRelease"></span></p>
                <p><strong>Rating:</strong> <span id="historyRating"></span></p>
                <p id="historyOverview"></p>
	<div id="historyTrailerSection" class="mt-3 d-none">
    	<h4>Trailer</h4>
    	<iframe id="historyTrailer" width="100%" height="270" frameborder="0" allowfullscreen></iframe>
	           </div>
            </div>

        </div>
